trigger:
- main  # El pipeline se ejecutará cuando haya cambios en la rama 'main'

pool:
  vmImage: 'ubuntu-latest'  # Usamos Ubuntu como agente para ejecutar el pipeline

variables:
  azureSubscription: 'demo-from-azure-devops'  # Nombre de tu suscripción de Azure configurada en DevOps
  appName: 'mywebX'  # El nombre de tu web app en Azure (debe ser único globalmente)
  resourceGroup: 'mi-grupo-de-recursos'  # Asegúrate de que este grupo de recursos exista en Azure

stages:
- stage: Build
  jobs:
  - job: BuildApp
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '6.x'
        installationPath: $(Agent.ToolsDirectory)/dotnet
    - script: |
        echo "Construyendo la aplicación..."
        dotnet build
      displayName: 'Compilar la aplicación'

- stage: Deploy
  jobs:
  - job: DeployToAzure
    steps:
    - task: AzureCLI@2  # Usamos Azure CLI para ejecutar comandos en tu suscripción de Azure
      inputs:
        azureSubscription: $(azureSubscription)  # Autenticación mediante tu Azure Subscription
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Desplegando en Azure..."
          
          # Comando para crear el grupo de recursos si no existe
          az group create --name $(resourceGroup) --location eastus

          # Desplegar la Web App
          az webapp up --name $(appName) --resource-group $(resourceGroup) --sku F1 --location eastus

      displayName: 'Desplegar a Azure'