trigger:
  - another-test  # Cambia a tu rama principal si es necesario

pool:
  vmImage: 'ubuntu-latest'  # Usamos el agente hospedado por Azure (ubuntu-latest)

steps:
  # Instalar Node.js
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Instalar Node.js'

  # Instalar dependencias y compilar
  - script: |
      npm install
      npm run build
    displayName: 'Instalar dependencias y compilar'

  # Publicar archivos como ZIP para despliegue
  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
      replaceExistingArchive: true
    displayName: 'Crear paquete ZIP'

  # Desplegar en Azure Web App
  - task: AzureWebApp@1
    inputs:
      azureSubscription: 'connection'  # Asegúrate de que este sea el nombre de tu suscripción de Azure en DevOps
      appName: 'mywebX'  # Asegúrate de que este nombre corresponda con el de tu Web App
      package: '$(Build.ArtifactStagingDirectory)/app.zip'
    displayName: 'Desplegar en Azure Web App'
